# The only gate main has: two parallel sessions push here directly, and until
# now the first thing to catch a broken file was the Vercel build — after the
# push. Typecheck and build on every push and PR, so breakage is visible
# before deploy and PRs can't land red.
name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# This job only reads the tree. Without this block the GITHUB_TOKEN handed to
# every step inherits the repository default, which on many repos is still
# read *and write* for contents, packages, issues and pull requests — so any
# compromised dependency running under `npm ci` or `next build` would get a
# token that can push to main. Nothing here needs more than checkout.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # design-lint, data-check, text-check, tsc and eslint — the checks a
      # contributor runs locally. Until now CI ran only tsc, so a hex literal
      # or a broken data invariant reached the branch that every CMS publish
      # rebuilds from, and blocked publishing until someone noticed.
      - run: npm run check
      - run: npm run build

  # The Cloudflare build (Astro + EmDash, see docs/CLOUDFLARE.md). It builds
  # from src/content — CI has no access to the D1 database — which is exactly
  # what a snapshot build compiles too, so a page that breaks here breaks
  # there. `cf:content check` proves every record survives the trip through
  # EmDash's schema unchanged.
  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run cf:check
      - run: npm run cf:content -- check
      - run: npx astro build
