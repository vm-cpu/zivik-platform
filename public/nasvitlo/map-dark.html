<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Карта подій — Центр Луї Зона</title>
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<link href="https://fonts.googleapis.com/css2?family=Charis+SIL:ital,wght@0,400;0,700;1,400&family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--red:#E0564B;--gold:#D6A24B;--blue:#6E97BE;--paper:#14100E;--land:#2A2320;--ukrfill:#3B2A24;--ink:#F1E9DC;--ink2:#B7AB99;--faint:#7C7062;--rule:#3A322C;--surface:#221B17}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--paper);font-family:'Fira Sans',sans-serif;overflow:hidden}
  #wrap{position:relative;width:100%;height:100vh}
  svg{position:absolute;inset:0;width:100%;height:100%;display:block}
  .land{fill:var(--land);stroke:#3B322C;stroke-width:.5}
  .ukr{fill:var(--ukrfill);stroke:#E0564B;stroke-width:1.1;stroke-linejoin:round;filter:drop-shadow(0 0 14px rgba(224,86,75,.35))}
  .grat{fill:none;stroke:rgba(214,162,75,.06);stroke-width:.5}
  .conn{fill:none;stroke:rgba(183,171,153,.22);stroke-width:1;stroke-dasharray:2 5;stroke-linecap:round;transition:stroke .15s,stroke-width .15s;pointer-events:none}
  .conn.hot{stroke:var(--gold);stroke-width:1.7;stroke-dasharray:4 5;animation:march 1s linear infinite;filter:drop-shadow(0 0 6px rgba(214,162,75,.7))}
  @keyframes march{to{stroke-dashoffset:-18}}
  .pin{position:absolute;cursor:pointer;z-index:3}
  .pin.event{transform:translate(-50%,-100%)}
  .pin.event .head{width:var(--s,22px);height:var(--s,22px);background:var(--c,var(--red));border:2.5px solid var(--paper);border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 0 0 2px rgba(255,255,255,.06),0 0 14px var(--c,var(--red));transition:transform .15s}
  .pin.event:hover .head,.pin.event.on .head{transform:rotate(-45deg) scale(1.16)}
  body[data-focus="yes"] .pin.event:not(.fresh) .head{opacity:.28;filter:grayscale(.7)}
  body[data-focus="yes"] .pin.event:not(.fresh) .tag{opacity:.3}
  body[data-focus="yes"] .pin.court{opacity:.35}
  body[data-focus="yes"] .conn:not(.fresh){opacity:.18}
  body[data-focus="yes"] .pin.event.fresh .head{box-shadow:0 0 0 3px rgba(230,182,92,.9),0 0 30px 10px rgba(230,182,92,.5)}
  body[data-focus="yes"] .conn.fresh{stroke:var(--gold);stroke-width:1.7;opacity:1}
  .freshtag{position:absolute;left:50%;top:-24px;transform:translateX(-50%);display:none;font:700 8.5px 'Fira Sans';letter-spacing:.09em;text-transform:uppercase;color:#3A2708;background:var(--gold);padding:2px 6px;border-radius:2px;white-space:nowrap}
  body[data-focus="yes"] .pin.event.fresh .freshtag{display:block}
  .pin.event .tag{position:absolute;left:calc(var(--s,22px) + 6px);top:0;white-space:nowrap;font:600 10px 'Fira Sans';color:var(--ink);background:var(--surface);padding:2px 7px;border:1px solid var(--rule);border-radius:2px;box-shadow:0 1px 3px rgba(60,40,20,.14)}
  .pin.court{transform:translate(-50%,-50%);z-index:2;display:flex;align-items:center;gap:6px}
  body[data-compact="yes"] .pin.event .tag{display:none}
  body[data-compact="yes"] .pin.event .head{--s:16px}
  body[data-compact="yes"] .pin.court .dia{width:11px;height:11px}
  body[data-compact="yes"] .pin.court .clab{font-size:8.5px;letter-spacing:.02em}
  body[data-compact="yes"] .pop{width:190px}
  .pin.court .dia{width:13px;height:13px;background:var(--paper);border:2px solid var(--ink2);transform:rotate(45deg);flex:none;transition:all .15s}
  .pin.court.rel .dia{background:var(--gold);border-color:var(--gold);box-shadow:0 0 10px rgba(214,162,75,.7)}
  .pin.court .clab{font:700 9.5px 'Fira Sans';letter-spacing:.03em;color:var(--ink2);white-space:nowrap;text-transform:uppercase;transition:color .15s}
  .pin.court.rel .clab{color:var(--gold)}
  .pop .cls{position:absolute;top:6px;right:6px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;background:none;border:0;cursor:pointer;font:400 17px/1 'Fira Sans';color:var(--faint);padding:0}
  .pop .cls:hover{color:var(--ink)}
  .pop .bd{padding-right:28px}
  .cpop{position:absolute;width:206px;background:var(--surface);border:1px solid var(--rule);box-shadow:0 12px 34px rgba(0,0,0,.5);z-index:19;transform:translate(-50%,calc(-100% - 18px));opacity:0;visibility:hidden;transition:opacity .14s;padding:11px 13px 12px}
  .cpop.show{opacity:1;visibility:visible}
  .cpop .ct{font:700 9.5px 'Fira Sans';letter-spacing:.11em;text-transform:uppercase;color:var(--gold);margin-bottom:7px}
  .cpop ul{list-style:none;display:flex;flex-direction:column;gap:6px}
  .cpop li{display:flex;gap:8px;align-items:baseline;font-size:11.5px;color:var(--ink2);line-height:1.35}
  .cpop li b{flex:none;font:700 10px 'Fira Sans';color:var(--ink);letter-spacing:.03em}
  .cpop::after{content:"";position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);border:7px solid transparent;border-top-color:var(--surface)}
  body[data-compact="yes"] .pop{width:168px}
  body[data-compact="yes"] .pop .bd{padding:9px 10px 10px;padding-right:24px}
  body[data-compact="yes"] .pop .ey{font-size:8.5px;margin-bottom:3px}
  body[data-compact="yes"] .pop h4{font-size:12.5px;margin-bottom:4px}
  body[data-compact="yes"] .pop p{font-size:10px;line-height:1.4;margin-bottom:6px}
  body[data-compact="yes"] .pop .crt{font-size:9px;margin-bottom:6px}
  body[data-compact="yes"] .pop a{font-size:8.5px}
  body[data-compact="yes"] .pop .cls{width:22px;height:22px;font-size:14px;top:3px;right:3px}
  body[data-compact="yes"] .cpop{width:150px;padding:9px 10px 10px}
  body[data-compact="yes"] .cpop .ct{font-size:8.5px;margin-bottom:5px}
  body[data-compact="yes"] .cpop li{font-size:10px;gap:6px}
  body[data-compact="yes"] .cpop li b{font-size:9px}
  body[data-compact="yes"] .cap{font-size:7.5px;right:9px;bottom:8px}
  .pop{position:absolute;width:224px;background:var(--surface);border:1px solid var(--rule);box-shadow:0 14px 40px rgba(0,0,0,.55);z-index:20;transform:translate(-50%,calc(-100% - 26px));opacity:0;visibility:hidden;transition:opacity .15s}
  .pop.show{opacity:1;visibility:visible}
  .pop .bar{height:3px}
  .pop .bd{padding:13px 15px 14px}
  .pop .ey{font:700 10px 'Fira Sans';letter-spacing:.09em;text-transform:uppercase;margin-bottom:4px}
  .pop h4{font-family:'Charis SIL',serif;font-weight:700;font-size:16px;line-height:1.2;color:var(--ink);margin-bottom:6px}
  .pop p{font-size:12px;color:var(--ink2);line-height:1.5;margin-bottom:8px}
  .pop .crt{font:600 10.5px 'Fira Sans';color:var(--gold);margin-bottom:9px}
  .pop a{font:700 10px 'Fira Sans';letter-spacing:.05em;text-transform:uppercase;color:var(--gold);text-decoration:none}
  .pop::after{content:"";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);border:8px solid transparent;border-top-color:var(--surface)}
  .cap{position:absolute;right:14px;bottom:11px;font:600 9px 'Fira Sans';letter-spacing:.07em;text-transform:uppercase;color:var(--faint);z-index:1}
  @media (prefers-reduced-motion: reduce){ .conn,.conn.hot{animation:none !important;transition:none !important} }
  /* narrow screens: dock the active popup to the bottom of the map as a card,
     instead of floating it over a marker (keeps the small map readable) */
  @media (max-width:560px){
    .pop.show,.cpop.show{
      left:10px !important;right:10px !important;top:auto !important;
      bottom:10px !important;width:auto !important;transform:none !important;
      max-height:54%;overflow-y:auto;
    }
    .pop.show::after,.cpop.show::after{display:none !important}
  }
</style>
</head>
<body>
<div id="wrap"><svg id="map"></svg><div class="cap">Природні дані Natural Earth · d3-geo</div></div>
<script>
const CATC = { hr:'#E0564B', war:'#D6A24B', asset:'#6E97BE' };
const COURTS = {
  hague:     { name:'Гаага',     lon:4.30,  lat:52.08, label:'Гаага', seats:[['ICJ','Міжнародний суд ООН'],['ICC','Міжнародний кримінальний суд'],['PCA','Постійна палата арбітражу']] },
  strasbourg:{ name:'Страсбург', lon:7.75,  lat:48.58, label:'Страсбург', seats:[['ЄСПЛ','Європейський суд з прав людини']] },
  hamburg:   { name:'Гамбург',   lon:9.99,  lat:53.55, label:'Гамбург', seats:[['ITLOS','Міжнародний трибунал з морського права']] },
  stockholm: { name:'Стокгольм', lon:18.07, lat:59.33, label:'Стокгольм', seats:[['SCC','Арбітражний інститут Торгової палати']] },
};
const EVENTS = [
  { key:'crimea', lon:34.55, lat:45.15, cat:'hr', s:26, tag:'Крим', ey:'Окупація · 2014', title:'Окупація Криму', note:'Порушення прав людини, націоналізація активів.', courts:['strasbourg','hague'], crt:'ECtHR (Страсбург) · PCA (Гаага)', cases:'8 проваджень', fresh:true, freshLabel:'Нове рішення ICJ' },
  { key:'kerch', lon:36.5, lat:45.3, cat:'asset', s:22, tag:'Керч', ey:'Затримання · 2018', title:'Затримання кораблів', note:'3 кораблі, 24 моряки. ITLOS + арбітраж PCA за UNCLOS.', courts:['hamburg','hague'], crt:'ITLOS (Гамбург) · PCA (Гаага)', cases:'2 провадження' },
  { key:'mh17', lon:38.63, lat:48.05, cat:'war', s:24, tag:'', ey:'MH17 · 17.07.2014', title:'Збиття рейсу MH17', note:'ECtHR, суд Нідерландів, ICAO-апеляція до ICJ.', courts:['strasbourg','hague'], crt:'ECtHR (Страсбург) · ICJ/суд (Гаага)', cases:'3 рішення', open:true },
  { key:'donbas', lon:37.9, lat:48.55, cat:'war', s:19, tag:'', ey:'Схід · 2014', title:'Схід України', note:'Збройний конфлікт — міждержавні заяви.', courts:['strasbourg'], crt:'ECtHR (Страсбург)', cases:'2 провадження' },
  { key:'energy', lon:34.6, lat:47.5, cat:'asset', s:19, tag:'', ey:'Енергетика · 2020', title:'Енергоактиви', note:'Ukrenergo, Energoatom, DTEK — арбітражі проти РФ.', courts:['hague'], crt:'PCA (Гаага)', cases:'6 арбітражів' },
  { key:'mariupol', lon:37.55, lat:47.1, cat:'war', s:18, tag:'', ey:'2022', title:'Воєнні злочини', note:'Ситуація в Україні — розслідування та ордери ICC.', courts:['hague'], crt:'ICC (Гаага)', cases:'ICC', fresh:true, freshLabel:'2 нові ордери' },
];
const wrap = document.getElementById('wrap');
const svg = d3.select('#map');
let ukr, others;
function closeAll(){
  wrap.querySelectorAll('.pop,.cpop').forEach(p=>p.classList.remove('show'));
  wrap.querySelectorAll('.pin.event').forEach(p=>p.classList.remove('on'));
  wrap.querySelectorAll('.pin.court').forEach(p=>p.classList.remove('rel'));
  svg.selectAll('.conn').classed('hot', false);
}
wrap.addEventListener('click', e=>{ if(!e.target.closest('.pin,.pop,.cpop')) closeAll(); });
document.addEventListener('keydown', e=>{ if(e.key === 'Escape') closeAll(); });
function draw(){
  const w = wrap.clientWidth, h = wrap.clientHeight;
  svg.attr('viewBox', `0 0 ${w} ${h}`).selectAll('*').remove();
  wrap.querySelectorAll('.pin,.pop').forEach(e=>e.remove());
  const frame = { type:'MultiPoint', coordinates:[[3,51.5],[19,59.6],[8,48],[40,49],[22,52],[33,44.5],[38.6,48]] };
  const proj = d3.geoMercator().fitExtent([[34,28],[w-34,h-30]], frame);
  const path = d3.geoPath(proj);
  const P = c => proj([c.lon, c.lat]);
  svg.append('path').datum(d3.geoGraticule().step([2,2])()).attr('class','grat').attr('d', path);
  svg.append('g').selectAll('path').data(others).join('path').attr('class','land').attr('d', path);
  svg.append('path').datum(ukr).attr('class','ukr').attr('d', path);
  const cg = svg.append('g');
  EVENTS.forEach(ev=>ev.courts.forEach(ck=>{
    cg.append('path').attr('class','conn' + (ev.fresh?' fresh':'')).attr('data-ev', ev.key)
      .attr('d', path({ type:'LineString', coordinates:[[ev.lon,ev.lat],[COURTS[ck].lon,COURTS[ck].lat]] }));
  }));
  const courtEl = {};
  Object.entries(COURTS).forEach(([k,c])=>{
    const [x,y] = P(c); const el = document.createElement('div');
    el.className = 'pin court'; el.style.left=x+'px'; el.style.top=y+'px';
    el.innerHTML = `<span class="dia"></span><span class="clab">${c.label}</span>`;
    wrap.appendChild(el); courtEl[k]=el;
    const cp = document.createElement('div');
    cp.className='cpop'; cp.style.left=x+'px'; cp.style.top=y+'px';
    cp.innerHTML = `<div class="ct">${c.name} · ${c.seats.length===1?'1 суд':c.seats.length+' суди'}</div><ul>` +
      c.seats.map(s=>`<li><b>${s[0]}</b><span>${s[1]}</span></li>`).join('') + `</ul>`;
    wrap.appendChild(cp);
    el.addEventListener('mouseenter', ()=>{ wrap.querySelectorAll('.cpop').forEach(p=>p.classList.remove('show')); cp.classList.add('show'); });
    el.addEventListener('mouseleave', ()=>cp.classList.remove('show'));
    el.addEventListener('click', e=>{ e.stopPropagation(); cp.classList.toggle('show'); });
  });
  EVENTS.forEach(ev=>{
    const [x,y] = P(ev); const pin = document.createElement('div');
    pin.className='pin event' + (ev.fresh?' fresh':''); pin.style.left=x+'px'; pin.style.top=y+'px';
    pin.style.setProperty('--c', CATC[ev.cat]); pin.style.setProperty('--s', ev.s+'px');
    pin.innerHTML = `<div class="head"></div>` + (ev.fresh?`<span class="freshtag">${ev.freshLabel}</span>`:'') + (ev.tag?`<span class="tag">${ev.tag}</span>`:'');
    wrap.appendChild(pin);
    const pop = document.createElement('div');
    pop.className='pop'; pop.style.left=x+'px'; pop.style.top=y+'px';
    pop.innerHTML = `<div class="bar" style="background:${CATC[ev.cat]}"></div><button class="cls" type="button" aria-label="Закрити">×</button><div class="bd"><div class="ey" style="color:${CATC[ev.cat]}">${ev.ey}</div><h4>${ev.title}</h4><p>${ev.note}</p><div class="crt">⟶ ${ev.crt}</div><a href="#">${ev.cases} →</a></div>`;
    wrap.appendChild(pop);
    const clamp = el=>{ const pw = el.offsetWidth, W = wrap.clientWidth; el.style.left = Math.min(Math.max(x, pw/2 + 6), W - pw/2 - 6) + 'px'; };
    const activate = ()=>{
      clamp(pop);
      wrap.querySelectorAll('.pop').forEach(p=>p.classList.remove('show'));
      wrap.querySelectorAll('.pin.event').forEach(p=>p.classList.remove('on'));
      wrap.querySelectorAll('.pin.court').forEach(p=>p.classList.remove('rel'));
      svg.selectAll('.conn').classed('hot', false);
      pop.classList.add('show'); pin.classList.add('on');
      svg.selectAll(`.conn[data-ev="${ev.key}"]`).classed('hot', true).raise();
      ev.courts.forEach(ck=>courtEl[ck].classList.add('rel'));
    };
    pin.addEventListener('mouseenter', activate);
    pin.addEventListener('click', e=>{ e.stopPropagation(); activate(); });
    pop.querySelector('.cls').addEventListener('click', e=>{ e.stopPropagation(); closeAll(); });
    pop.addEventListener('click', e=>e.stopPropagation());
    if(ev.open && !document.body.hasAttribute('data-compact')) activate();
  });
}
d3.json((window.__resources && window.__resources.atlas) || 'https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json').then(topo=>{
  const q = new URLSearchParams(location.search);
  if(q.get('focus') === 'yes') document.body.setAttribute('data-focus','yes');
  if(q.get('compact') === 'yes') document.body.setAttribute('data-compact','yes');
  const feats = topojson.feature(topo, topo.objects.countries).features;
  ukr = feats.find(f=>f.id === '804');
  others = feats.filter(f=>f.id !== '804');
  draw();
  window.addEventListener('resize', draw);
});
</script>
</body>
</html>
